name: publish

# 改 package.json 的 version 推到 main，就自动打 tag 并发版：
#   npm version patch --no-git-tag-version && git commit -am "release: 0.1.1" && git push
# 也保留手动打 tag（git tag v0.1.1 && git push origin v0.1.1）和 Actions 页面手动触发。
on:
  push:
    branches: [main]
    paths: ['package.json']
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write # 需要自己推 tag
  id-token: write # npm Trusted Publishing（OIDC）靠这个换短时发布令牌

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 读 package.json 的版本
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: tag 与版本必须一致（tag 触发时）
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "$GITHUB_REF_NAME" != "v${{ steps.pkg.outputs.version }}" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 的 ${{ steps.pkg.outputs.version }} 不一致"
            exit 1
          fi

      - name: npm 上已有这个版本就跳过
        id: skip
        run: |
          if npm view "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" version > /dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }} 已经发布过，跳过"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.skip.outputs.skip == 'false'
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted Publishing 需要 npm >= 11.5.1，Node 22 自带的是 10.x
      - if: steps.skip.outputs.skip == 'false'
        run: npm install --global npm@11

      - if: steps.skip.outputs.skip == 'false'
        run: npm ci

      - if: steps.skip.outputs.skip == 'false'
        run: npm run check

      - name: 没有 tag 就补一个（main 触发时）
        if: steps.skip.outputs.skip == 'false' && startsWith(github.ref, 'refs/heads/')
        run: |
          tag="v${{ steps.pkg.outputs.version }}"
          if git ls-remote --exit-code --tags origin "$tag" > /dev/null 2>&1; then
            echo "$tag 已存在（上次大概发布失败了），继续用这个 tag 发"
          else
            git tag "$tag"
            git push origin "$tag"
          fi

      - if: steps.skip.outputs.skip == 'false'
        run: npm publish --provenance --access public
